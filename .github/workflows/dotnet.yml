name: .NET CI/CD

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  build-test-deploy:
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v4
    
    # Updated to .NET 10
    - name: Setup .NET
      uses: actions/setup-dotnet@v4
      with:
        dotnet-version: '10.0.x'
        
    # Running these commands at the root level will automatically find 
    # your .sln file and build both FileCraftAPI and FileSharingSystem
    - name: Restore dependencies
      run: dotnet restore
      
    - name: Build
      run: dotnet build --no-restore -c Release
      
    - name: Test
      run: dotnet test --no-build -c Release --verbosity normal

    # The deployment step only runs if the previous steps succeed, 
    # and ONLY if this action was triggered by a direct push/merge to main.
    # It will safely ignore pull requests.
    - name: Trigger Render Deployment
      if: success() && github.event_name == 'push' && github.ref == 'refs/heads/main'
      run: curl -X POST ${{ secrets.RENDER_FC }}